<!-- Mermaid Diagramme -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ 
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'loose',
    themeVariables: {
      // Hintergrund
      background: '#2d2d2d',
      primaryColor: '#3a5a50',
      secondaryColor: '#4a3a5a',
      tertiaryColor: '#3a4a5a',
      
      // Hauptfarben (passend zu Überschriften)
      primaryTextColor: '#dcddde',
      secondaryTextColor: '#dcddde',
      tertiaryTextColor: '#dcddde',
      lineColor: '#94D3C6',
      textColor: '#dcddde',
      
      // Knoten-Farben
      nodeBorder: '#94D3C6',
      nodeTextColor: '#dcddde',
      
      // Flowchart
      mainBkg: '#3a5a50',
      nodeBkg: '#3a5a50',
      clusterBkg: '#363636',
      clusterBorder: '#e4b9eb',
      defaultLinkColor: '#A9E2EA',
      edgeLabelBackground: '#2d2d2d',
      
      // Sequenz-Diagramme
      actorBkg: '#3a5a50',
      actorBorder: '#94D3C6',
      actorTextColor: '#dcddde',
      actorLineColor: '#94D3C6',
      signalColor: '#A9E2EA',
      signalTextColor: '#dcddde',
      labelBoxBkgColor: '#3a4a5a',
      labelBoxBorderColor: '#A9E2EA',
      labelTextColor: '#dcddde',
      loopTextColor: '#dcddde',
      noteBkgColor: '#4a3a5a',
      noteBorderColor: '#e4b9eb',
      noteTextColor: '#dcddde',
      activationBkgColor: '#3a5a50',
      activationBorderColor: '#94D3C6',
      sequenceNumberColor: '#2d2d2d',
      
      // Pie Charts
      pie1: '#94D3C6',
      pie2: '#A9E2EA',
      pie3: '#e4b9eb',
      pie4: '#80ADC7',
      pie5: '#80C7B2',
      pie6: '#E1A2ED',
      pie7: '#7ac4b7',
      pieStrokeColor: '#2d2d2d',
      pieStrokeWidth: '2px',
      pieTitleTextColor: '#dcddde',
      pieSectionTextColor: '#2d2d2d',
      pieLegendTextColor: '#dcddde',
      
      // Git-Diagramme
      git0: '#94D3C6',
      git1: '#A9E2EA',
      git2: '#e4b9eb',
      git3: '#80ADC7',
      gitBranchLabel0: '#2d2d2d',
      gitBranchLabel1: '#2d2d2d',
      gitBranchLabel2: '#2d2d2d',
      
      // Schriftart
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif'
    },
    flowchart: { 
      useMaxWidth: true,
      htmlLabels: true,
      curve: 'basis',
      nodeSpacing: 50,
      rankSpacing: 50
    }
  });
  
  document.addEventListener('DOMContentLoaded', async () => {
    const codeBlocks = document.querySelectorAll('pre > code.language-mermaid');
    for (const codeBlock of codeBlocks) {
      const pre = codeBlock.parentElement;
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = codeBlock.textContent;
      pre.parentNode.replaceChild(container, pre);
    }
    await mermaid.run();
  });
</script>
<style>
  .mermaid {
    background: #363636;
    border-radius: 8px;
    padding: 1rem;
    margin: 1.5rem 0;
    overflow-x: auto;
    border: 1px solid #4a4a4a;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
  /* Mermaid Text-Farben erzwingen */
  .mermaid .nodeLabel,
  .mermaid .edgeLabel,
  .mermaid .label {
    color: #dcddde !important;
    fill: #dcddde !important;
  }
  .mermaid .edgePath .path {
    stroke: #94D3C6 !important;
  }
  .mermaid .arrowheadPath {
    fill: #94D3C6 !important;
  }
</style>
