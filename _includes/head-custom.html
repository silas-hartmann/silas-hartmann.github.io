<!-- Mermaid Diagramme -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ 
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'loose',
    themeVariables: {
      // Hintergrund
      background: '#2d2d2d',
      primaryColor: '#3a5a50',
      secondaryColor: '#4a3a5a',
      tertiaryColor: '#3a4a5a',
      
      // Hauptfarben (passend zu Überschriften)
      primaryTextColor: '#dcddde',
      secondaryTextColor: '#dcddde',
      tertiaryTextColor: '#dcddde',
      lineColor: '#94D3C6',
      textColor: '#dcddde',
      
      // Knoten-Farben
      nodeBorder: '#94D3C6',
      nodeTextColor: '#dcddde',
      
      // Flowchart
      mainBkg: '#3a5a50',
      nodeBkg: '#3a5a50',
      clusterBkg: '#363636',
      clusterBorder: '#e4b9eb',
      defaultLinkColor: '#A9E2EA',
      edgeLabelBackground: '#2d2d2d',
      
      // Sequenz-Diagramme
      actorBkg: '#3a5a50',
      actorBorder: '#94D3C6',
      actorTextColor: '#dcddde',
      actorLineColor: '#94D3C6',
      signalColor: '#A9E2EA',
      signalTextColor: '#dcddde',
      labelBoxBkgColor: '#3a4a5a',
      labelBoxBorderColor: '#A9E2EA',
      labelTextColor: '#dcddde',
      loopTextColor: '#dcddde',
      noteBkgColor: '#4a3a5a',
      noteBorderColor: '#e4b9eb',
      noteTextColor: '#dcddde',
      activationBkgColor: '#3a5a50',
      activationBorderColor: '#94D3C6',
      sequenceNumberColor: '#2d2d2d',
      
      // Pie Charts
      pie1: '#94D3C6',
      pie2: '#A9E2EA',
      pie3: '#e4b9eb',
      pie4: '#80ADC7',
      pie5: '#80C7B2',
      pie6: '#E1A2ED',
      pie7: '#7ac4b7',
      pieStrokeColor: '#2d2d2d',
      pieStrokeWidth: '2px',
      pieTitleTextColor: '#dcddde',
      pieSectionTextColor: '#2d2d2d',
      pieLegendTextColor: '#dcddde',
      
      // Git-Diagramme
      git0: '#94D3C6',
      git1: '#A9E2EA',
      git2: '#e4b9eb',
      git3: '#80ADC7',
      gitBranchLabel0: '#2d2d2d',
      gitBranchLabel1: '#2d2d2d',
      gitBranchLabel2: '#2d2d2d',
      
      // Schriftart
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif'
    },
    flowchart: { 
      useMaxWidth: true,
      htmlLabels: true,
      curve: 'basis',
      nodeSpacing: 50,
      rankSpacing: 50
    }
  });
  
  // Berechnet die relative Luminanz einer Farbe (0-1)
  function getLuminance(r, g, b) {
    const [rs, gs, bs] = [r, g, b].map(c => {
      c = c / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
  }
  
  // Parst eine Farbe (hex oder rgb) und gibt RGB-Werte zurück
  function parseColor(color) {
    if (!color) return null;
    
    // Hex-Farbe (3 oder 6 Zeichen)
    const hexMatch = color.match(/#([0-9a-f]{3,6})/i);
    if (hexMatch) {
      let hex = hexMatch[1];
      if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
      }
      return {
        r: parseInt(hex.substr(0, 2), 16),
        g: parseInt(hex.substr(2, 2), 16),
        b: parseInt(hex.substr(4, 2), 16)
      };
    }
    
    // RGB-Farbe
    const rgbMatch = color.match(/rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/i);
    if (rgbMatch) {
      return {
        r: parseInt(rgbMatch[1]),
        g: parseInt(rgbMatch[2]),
        b: parseInt(rgbMatch[3])
      };
    }
    
    return null;
  }
  
  // Findet die Füllfarbe eines Elements (style oder Attribut)
  function getFillColor(element) {
    // Erst im style-Attribut suchen
    const style = element.getAttribute('style');
    if (style) {
      const fillMatch = style.match(/fill:\s*([^;]+)/i);
      if (fillMatch) {
        return fillMatch[1].trim();
      }
    }
    // Dann im fill-Attribut
    const fillAttr = element.getAttribute('fill');
    if (fillAttr) {
      return fillAttr;
    }
    return null;
  }
  
  // Passt die Textfarbe basierend auf der Hintergrundfarbe an
  function adjustTextColors(container) {
    const LUMINANCE_THRESHOLD = 0.45;
    const DARK_TEXT_COLOR = '#2d2d2d';
    
    // Alle Node-Gruppen finden
    const nodeGroups = container.querySelectorAll('g.node');
    
    nodeGroups.forEach(nodeGroup => {
      // Finde die Hintergrundform (rect, polygon, circle, path)
      const shape = nodeGroup.querySelector('rect, polygon, circle, ellipse, path');
      if (!shape) return;
      
      const fillColor = getFillColor(shape);
      if (!fillColor) return;
      
      const color = parseColor(fillColor);
      if (!color) return;
      
      const luminance = getLuminance(color.r, color.g, color.b);
      
      if (luminance > LUMINANCE_THRESHOLD) {
        // Helle Hintergrundfarbe -> dunkle Schrift
        // Finde alle Text-Elemente im Node
        const textElements = nodeGroup.querySelectorAll('text, tspan, span, div, p, .nodeLabel');
        textElements.forEach(text => {
          text.style.setProperty('fill', DARK_TEXT_COLOR, 'important');
          text.style.setProperty('color', DARK_TEXT_COLOR, 'important');
        });
        
        // Auch foreignObject-Inhalte
        const foreignObjects = nodeGroup.querySelectorAll('foreignObject *');
        foreignObjects.forEach(el => {
          el.style.setProperty('color', DARK_TEXT_COLOR, 'important');
        });
      }
    });
  }
  
  document.addEventListener('DOMContentLoaded', async () => {
    const codeBlocks = document.querySelectorAll('pre > code.language-mermaid');
    for (const codeBlock of codeBlocks) {
      const pre = codeBlock.parentElement;
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = codeBlock.textContent;
      pre.parentNode.replaceChild(container, pre);
    }
    await mermaid.run();
    
    // Nach dem Rendering: Textfarben anpassen (mit kurzem Delay für vollständiges Rendering)
    setTimeout(() => {
      document.querySelectorAll('.mermaid').forEach(adjustTextColors);
    }, 100);
  });
</script>
<style>
  .mermaid {
    background: #363636;
    border-radius: 8px;
    padding: 1rem;
    margin: 1.5rem 0;
    overflow-x: auto;
    border: 1px solid #4a4a4a;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
  /* Mermaid Text-Farben erzwingen */
  .mermaid .nodeLabel,
  .mermaid .edgeLabel,
  .mermaid .label {
    color: #dcddde !important;
    fill: #dcddde !important;
  }
  .mermaid .edgePath .path {
    stroke: #94D3C6 !important;
  }
  .mermaid .arrowheadPath {
    fill: #94D3C6 !important;
  }
</style>
